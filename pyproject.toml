[project]
name = "vecto-svg"
version = "0.2.0"
description = "Turn PNG/JPG images into clean, small SVGs: logos, icons, signatures, cut files, colour art. CLI, Python API and MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["svg", "vectorize", "vectorizer", "potrace", "trace", "bitmap", "png-to-svg", "cricut", "laser", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "potracer>=0.0.4",
    "resvg-py>=0.5.0",
    "scour>=0.38.2",
    "typer>=0.15",
    "vtracer>=0.6.15",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
vecto = "vecto.cli:app"

[project.urls]
Homepage = "https://github.com/hugoogb/vecto"
Issues = "https://github.com/hugoogb/vecto/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["examples/out", ".github"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["vecto"]
